name: Contracts

on:
  push:
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

