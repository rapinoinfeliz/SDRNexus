name: .NET

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "scripts/fetch-sdrsharp-sdk.sh"
      - "scripts/package-release.ps1"
      - "installer/**"
      - "Directory.Build.props"
      - "global.json"
      - "SDRNexus.sln"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "scripts/fetch-sdrsharp-sdk.sh"
      - "scripts/package-release.ps1"
      - "installer/**"
      - "Directory.Build.props"
      - "global.json"
      - "SDRNexus.sln"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned SDR# SDK reference assemblies
        shell: bash
        run: ./scripts/fetch-sdrsharp-sdk.sh
      - run: dotnet restore SDRNexus.sln
      - run: dotnet build SDRNexus.sln --configuration Release --no-restore
      - run: dotnet test SDRNexus.sln --configuration Release --no-build
      - name: Build Windows test package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Configuration Release -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SDRNexus-windows-x64
          path: |
            artifacts/SDRNexus-0.1.0-windows-x64.zip
            artifacts/SDRNexus-0.1.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
